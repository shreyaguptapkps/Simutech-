<!doctype html><html><head><meta charset=utf8><title>SimuTech</title><meta name="theme-color" content="#6B4EDB"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AC%3C/text%3E%3C/svg%3E"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SimuTech</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFF6E9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--cream:#FFF6E9;--cream2:#F6E7CF;--ink:#1B1530;--muted:#675F82;--purple:#6B4EDB;--purple-d:#4A34A8;--mint:#8EF0BC;--sky:#A9DDF7;--lime:#D2F34C;--pink:#F6A9D8;--lemon:#FFE680;--lav:#D9D4F0;--peach:#FFB38A;--card:#FFFFFF;--line:rgba(27,21,48,.12);--f-head:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;--f-body:'Nunito','Segoe UI',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream2);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body{background:var(--cream2)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--purple);outline-offset:2px;border-radius:12px}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600;line-height:1.1;text-wrap:balance}
p{margin:0}
#app{position:relative;max-width:460px;min-height:100dvh;margin:0 auto;background:var(--cream);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));overflow-x:clip}
@media(min-width:520px){#app{box-shadow:0 0 0 2px rgba(27,21,48,.06),0 30px 80px rgba(27,21,48,.14);border-radius:0}}
#screen{padding-block:18px 108px;min-height:100dvh}
#screen.enter>*{animation:rise .38s cubic-bezier(.2,.9,.3,1) both}
#screen.enter>*:nth-child(2){animation-delay:.04s}#screen.enter>*:nth-child(3){animation-delay:.08s}#screen.enter>*:nth-child(4){animation-delay:.12s}#screen.enter>*:nth-child(5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.noanim *,.noanim *::before,.noanim *::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}

/* nav */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);z-index:20;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--cream) 70%,rgba(255,246,233,0))}
#nav .row{display:flex;gap:4px;background:#fff;border-radius:30px;padding:6px;box-shadow:0 8px 24px rgba(27,21,48,.14)}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:24px;text-decoration:none;color:var(--muted);font-weight:800;font-size:11px;min-height:48px;transition:background .2s,color .2s,transform .2s}
#nav a svg{width:24px;height:24px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#nav a[aria-current=page]{background:var(--ink);color:#fff}
#nav a[aria-current=page] svg{transform:translateY(-1px) scale(1.12)}
#nav a:active{transform:scale(.94)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;background:var(--purple);color:#fff;font-family:var(--f-head);font-weight:600;font-size:17px;box-shadow:0 5px 0 var(--purple-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--purple-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(27,21,48,.14)}
.btn.ghost:active{box-shadow:0 1px 0 rgba(27,21,48,.14)}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.icon-btn{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 rgba(27,21,48,.1);flex:none;transition:transform .1s}
.icon-btn:active{transform:translateY(3px)}
.icon-btn svg{width:22px;height:22px}
.icon-btn[aria-pressed=true]{background:var(--pink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-weight:800;font-size:12.5px;background:#fff}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* simo */
.simo{display:block;overflow:visible}
.simo .arm{transform-box:fill-box;transform-origin:100% 100%}
.simo .wave{animation:wave 1.1s ease-in-out infinite;transform-origin:88% 90%}
@keyframes wave{50%{transform:rotate(-18deg)}}
.simo.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.simo .spark{animation:tw 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{transform:scale(.4) rotate(40deg);opacity:.5}}
.simo .blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

/* home */
.hello{display:flex;align-items:flex-end;gap:6px;margin-bottom:14px}
.hello .txt{flex:1;padding-bottom:10px}
.hello h1{font-size:31px}
.hello p{color:var(--muted);font-weight:700;margin-top:4px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:0 18px;min-height:54px;box-shadow:0 5px 0 rgba(27,21,48,.1);margin-bottom:16px}
.search svg{width:22px;height:22px;flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-weight:700;font-size:16px;color:var(--ink);min-height:50px;outline:none}
.search:focus-within{box-shadow:0 5px 0 var(--purple)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border-radius:28px;padding:14px;text-align:left;overflow:hidden;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s cubic-bezier(.3,1.6,.5,1);text-decoration:none;color:var(--ink)}
.tile:active{transform:scale(.96) rotate(-1deg)}
.tile h3{font-size:20px}
.tile .n{font-weight:800;font-size:12.5px;opacity:.7}
.tile .ico{width:54px;height:54px}
.tile:hover .ico{animation:wob .5s}
@keyframes wob{25%{transform:rotate(-10deg) scale(1.1)}75%{transform:rotate(10deg) scale(1.1)}}
.feat{grid-column:1/-1;background:var(--ink);color:#fff;min-height:200px;flex-direction:row;align-items:stretch;gap:6px;padding:16px}
.feat .l{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0;z-index:1}
.feat .tagline{font-size:13.5px;font-weight:700;color:rgba(255,255,255,.78);margin-top:6px}
.feat img{width:46%;max-width:190px;align-self:center;flex:none;animation:float 4s ease-in-out infinite;margin-right:-8px}
@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}
.feat .blob{position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:var(--tint,var(--sky));opacity:.95}
.feat .chip{background:var(--lemon);color:var(--ink);align-self:flex-start}
.prog{grid-column:1/-1;background:var(--lime);min-height:0;flex-direction:row;align-items:center;gap:14px;padding:16px}
.prog .big{font-family:var(--f-head);font-weight:600;font-size:52px;line-height:1}
.prog .bar{height:12px;border-radius:99px;background:rgba(27,21,48,.14);margin-top:8px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec-h h2{font-size:22px}
.link{font-weight:800;color:var(--purple);text-decoration:none;font-size:14px;min-height:44px;display:inline-flex;align-items:center}

/* category icons */
.a-wob{animation:wob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.a-spin{animation:spin 2.4s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes spin{to{transform:rotate(360deg)}}
.a-pulse{animation:pulse 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{transform:scale(1.1)}}
.a-lid{animation:lid 2.8s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
@keyframes lid{50%{transform:scaleY(.55) skewX(-8deg)}}
.a-air{animation:air 1.2s linear infinite}
@keyframes air{from{transform:translateX(-4px);opacity:0}50%{opacity:1}to{transform:translateX(5px);opacity:0}}
.a-bounce{animation:bounce 1.3s ease-in-out infinite;transform-box:fill-box}
@keyframes bounce{50%{transform:translateY(-3px)}}
.a-flick{animation:flick 3s steps(1) infinite}
@keyframes flick{0%{fill:#8EF0BC}33%{fill:#FFE680}66%{fill:#F6A9D8}}

/* explore */
.page-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.page-h h1{font-size:30px;flex:1}
.orbit{display:flex;flex-direction:column;gap:12px}
.cat{display:flex;align-items:center;gap:14px;border-radius:30px;padding:12px 18px 12px 12px;text-decoration:none;color:var(--ink);width:92%;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.cat:nth-child(even){align-self:flex-end;flex-direction:row-reverse;text-align:right;padding:12px 12px 12px 18px}
.cat:active{transform:scale(.97)}
.cat .ico{width:62px;height:62px;background:rgba(255,255,255,.65);border-radius:22px;padding:6px;flex:none}
.cat h3{font-size:22px}
.cat p{font-weight:700;font-size:13px;opacity:.72}
.banner{margin-top:18px;border-radius:28px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:16px;text-decoration:none}
.banner b{font-family:var(--f-head);font-size:20px;font-weight:600;display:block}
.banner span{font-size:13.5px;color:rgba(255,255,255,.75);font-weight:700}

/* device stack */
.cat-h{border-radius:32px;padding:18px;margin-bottom:22px;display:flex;align-items:center;gap:10px;position:relative}
.cat-h h1{font-size:30px}
.cat-h p{font-weight:700;opacity:.75;font-size:14px}
.cat-h .simo{margin:-6px 0 -22px auto;flex:none}
.stack{display:flex;flex-direction:column;gap:18px}
.dcard{position:relative;border-radius:30px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.dcard:nth-child(odd){transform:rotate(-1.2deg)}.dcard:nth-child(even){transform:rotate(1.2deg)}
.dcard:active{transform:scale(.97) rotate(0)}
.dcard .top{display:flex;gap:10px;align-items:center}
.dcard img{width:46%;max-width:178px;flex:none;filter:drop-shadow(0 8px 6px rgba(27,21,48,.12))}
.dcard h3{font-size:23px}
.dcard .brand{font-size:12.5px;font-weight:800;opacity:.65}
.dcard .tg{background:rgba(255,255,255,.75);border-radius:16px;padding:8px 12px;font-weight:700;font-size:13.5px}
.dcard .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.dcard .btn{margin-left:auto}
.dcard .sv{position:absolute;top:10px;right:10px}

/* sim */
.sim .bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sim .bar .t{flex:1;min-width:0}
.sim .bar h1{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim .bar span{font-size:12.5px;font-weight:800;color:var(--muted)}
.stage{position:relative;border-radius:34px;height:clamp(300px,46dvh,440px);overflow:hidden;background:radial-gradient(120% 90% at 50% 100%,var(--tint) 0%,#fff 78%);box-shadow:inset 0 0 0 2px rgba(27,21,48,.07)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage .simo-slot{position:absolute;right:6px;top:4px;pointer-events:none;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.stage .simo-slot.pop{transform:translateY(-6px) scale(1.12) rotate(-4deg)}
.say{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;border-radius:22px;padding:10px 14px 11px;box-shadow:0 6px 0 rgba(27,21,48,.1);pointer-events:none}
.say b{font-family:var(--f-head);font-size:13px;font-weight:600;color:var(--purple);letter-spacing:.05em;text-transform:uppercase}
.say p{font-weight:700;font-size:14.5px;line-height:1.35}
.say.flash{animation:flash .5s}
@keyframes flash{30%{transform:scale(1.03)}}
.hintrow{position:absolute;left:12px;top:12px;display:flex;gap:6px;align-items:center;max-width:calc(100% - 118px)}
.hintrow .chip{font-size:11.5px;line-height:1.25;padding:4px 10px;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 2px var(--line)}
.reset{position:absolute;left:12px;top:64px;min-height:44px;padding:0 12px;font-size:12px;font-weight:800;border-radius:99px;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 2px var(--line)}
.progress{display:flex;align-items:center;gap:10px;margin:14px 2px 4px;font-weight:800;font-size:14px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2.5px var(--line);transition:background .3s,transform .3s cubic-bezier(.3,1.8,.5,1)}
.dots i.done{background:var(--purple);box-shadow:none;transform:scale(1.15)}
.tabs{display:flex;gap:6px;background:#fff;border-radius:99px;padding:5px;margin:12px 0}
.tabs button{flex:1;min-height:44px;border-radius:99px;font-family:var(--f-head);font-weight:600;font-size:15px;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
.ctls{display:flex;flex-direction:column;gap:12px}
.ctl{background:#fff;border-radius:24px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ctl .lab{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14.5px}
.ctl .lab output{font-family:var(--f-head);font-weight:600;color:var(--purple);font-size:16px;font-variant-numeric:tabular-nums}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:44px;text-align:left}
.tgl .sw{width:58px;height:34px;border-radius:99px;background:var(--lav);position:relative;transition:background .2s;flex:none}
.tgl .sw::after{content:"";position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(27,21,48,.2);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tgl[aria-pressed=true] .sw{background:var(--purple)}
.tgl[aria-pressed=true] .sw::after{transform:translateX(24px)}
.tgl .st{font-family:var(--f-head);font-weight:600;color:var(--muted);margin-left:auto;margin-right:8px;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:44px;padding:0 12px;border-radius:99px;background:var(--cream);font-weight:800;font-size:13.5px;box-shadow:inset 0 0 0 2px var(--line);transition:background .15s,transform .15s cubic-bezier(.3,1.8,.5,1)}
.seg button.on{background:var(--purple);color:#fff;box-shadow:none;transform:scale(1.04)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:99px;background:var(--lav)}
input[type=range]::-moz-range-track{height:12px;border-radius:99px;background:var(--lav)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-10px;border-radius:50%;background:var(--purple);border:4px solid #fff;box-shadow:0 3px 0 rgba(27,21,48,.25)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--purple);border:4px solid #fff}
.pressbtn{width:100%;min-height:56px;border-radius:24px;background:var(--lemon);font-family:var(--f-head);font-weight:600;font-size:18px;box-shadow:0 6px 0 #D9B93C;transition:transform .08s,box-shadow .08s}
.pressbtn:active,.pressbtn.active{transform:translateY(5px);box-shadow:0 1px 0 #D9B93C;background:#FFD84D}
.sig{display:flex;flex-direction:column;gap:12px}
.fn{background:#fff;border-radius:26px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.fn .ck{flex:none;width:34px;height:34px;border-radius:50%;background:var(--cream);box-shadow:inset 0 0 0 2.5px var(--line);display:grid;place-items:center}
.fn.done .ck{background:var(--mint);box-shadow:none}
.fn .ck svg{width:18px;height:18px;opacity:0}.fn.done .ck svg{opacity:1}
.fn h3{font-size:19px;margin-bottom:3px}
.fn p{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:8px}
.sim-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.sim-actions .btn{flex:1}

/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;position:relative;margin-top:6px}
.cmp .col{padding:12px 10px 16px}
.cmp .col:first-child{background:var(--sky);border-radius:30px 0 0 30px}
.cmp .col:last-child{background:var(--pink);border-radius:0 30px 30px 0}
.cmp .vs{position:absolute;left:50%;top:92px;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--f-head);font-weight:700;display:grid;place-items:center;z-index:2;box-shadow:0 0 0 5px var(--cream)}
.cmp select{width:100%;min-height:46px;border-radius:16px;border:0;background:rgba(255,255,255,.85);font:inherit;font-weight:800;font-size:14px;padding:0 10px;color:var(--ink)}
.cmp img{width:100%;max-width:170px;display:block;margin:6px auto 2px}
.cmp h3{font-size:19px;text-align:center}
.cmp .tg{font-size:12.5px;font-weight:700;text-align:center;opacity:.75;margin:2px 0 10px}
.cmp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.cmp li{background:rgba(255,255,255,.78);border-radius:16px;padding:8px 10px;font-size:12.5px;font-weight:700;line-height:1.3}
.cmp li b{display:block;font-family:var(--f-head);font-size:14.5px;font-weight:600}
.cmp .btn{width:100%;margin-top:12px;font-size:14px;padding:0 8px}
.note{font-size:13.5px;font-weight:700;color:var(--muted);margin:12px 2px}

/* saved + badges */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sticker{position:relative;border-radius:22px;padding:12px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.sticker:nth-child(odd){transform:rotate(-2deg)}.sticker:nth-child(even){transform:rotate(1.8deg)}
.sticker:active{transform:scale(.95)}
.sticker::before{content:"";position:absolute;top:-9px;left:50%;width:56px;height:18px;background:rgba(255,230,128,.85);transform:translateX(-50%) rotate(-3deg);border-radius:3px}
.sticker img{width:100%;max-width:120px}
.sticker h3{font-size:17px}.sticker p{font-size:12px;font-weight:700;opacity:.7}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:6px 2px}
.badge .coin{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:inset 0 0 0 4px rgba(255,255,255,.7),0 5px 0 rgba(27,21,48,.14);transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.badge:nth-child(3n+1) .coin{transform:rotate(-6deg)}.badge:nth-child(3n+2) .coin{transform:rotate(4deg)}.badge:nth-child(3n) .coin{transform:rotate(-2deg)}
.badge .coin svg{width:46px;height:46px}
.badge.locked .coin{background:transparent!important;box-shadow:inset 0 0 0 3px var(--line);border:0}
.badge.locked .coin svg{opacity:.28;filter:grayscale(1)}
.badge b{font-family:var(--f-head);font-weight:600;font-size:13.5px;line-height:1.1}
.badge span{font-size:11px;font-weight:700;color:var(--muted);line-height:1.2}

<canvas id="confetti" aria-hidden="true"></canvas>
<script>
/* ===== SimuTech mini 3D engine: faces, nodes, painter's algorithm, no libraries ===== */
const hex=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const ease=(o,k,target,sp,dt)=>{if(o[k]==null||isNaN(o[k]))o[k]=target;o[k]=lerp(o[k],target,1-Math.exp(-sp*dt));return o[k]};

class Node{
  constructor(o){o=o||{};this.t=o.t||[0,0,0];this.r=o.r||[0,0,0];this.s=o.s==null?1:o.s;this.k=[];this.f=o.f||[];this.vis=true;
    this.hit=o.hit||null;this.bias=o.bias||0;this.anchor=o.anchor||null;this.anchorP=o.anchorP||null;this.alpha=o.alpha==null?1:o.alpha;this.glow=0;this.spr=null;this.ring=null;}
  add(){for(const n of arguments)this.k.push(n);return this}
  color(c){const rgb=typeof c==='string'?hex(c):c;for(const f of this.f)f.c=rgb;return this}
}

const newell=p=>{let x=0,y=0,z=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];x+=(a[1]-b[1])*(a[2]+b[2]);y+=(a[2]-b[2])*(a[0]+b[0]);z+=(a[0]-b[0])*(a[1]+b[1])}return[x,y,z]};
function orient(p,c,col,extra){const n=newell(p);let cx=0,cy=0,cz=0;for(const q of p){cx+=q[0];cy+=q[1];cz+=q[2]}cx/=p.length;cy/=p.length;cz/=p.length;
  if(n[0]*(cx-c[0])+n[1]*(cy-c[1])+n[2]*(cz-c[2])<0)p=p.slice().reverse();return Object.assign({p,c:hex(col)},extra)}
const mk=(f,o)=>{const n=new Node(o);n.f=f;return n};

function box(w,h,d,col,o){const x=w/2,y=h/2,z=d/2;const v=[[-x,-y,-z],[x,-y,-z],[x,y,-z],[-x,y,-z],[-x,-y,z],[x,-y,z],[x,y,z],[-x,y,z]];
  const ix=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[2,3,7,6],[1,2,6,5],[0,3,7,4]];return mk(ix.map(i=>orient(i.map(j=>v[j]),[0,0,0],col)),o)}

function rr(w,h,r,k){k=k||3;const pts=[];const cs=[[w/2-r,h/2-r,0],[-w/2+r,h/2-r,Math.PI/2],[-w/2+r,-h/2+r,Math.PI],[w/2-r,-h/2+r,1.5*Math.PI]];
  for(const c of cs)for(let i=0;i<=k;i++){const a=c[2]+i/k*Math.PI/2;pts.push([c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)])}return pts}

function slab(w,h,d,r,col,o){const pr=rr(w,h,r,3),n=pr.length,z=d/2,F=[];
  F.push(orient(pr.map(q=>[q[0],q[1],z]),[0,0,0],col),orient(pr.map(q=>[q[0],q[1],-z]),[0,0,0],col));
  for(let i=0;i<n;i++){const a=pr[i],b=pr[(i+1)%n];F.push(orient([[a[0],a[1],-z],[b[0],b[1],-z],[b[0],b[1],z],[a[0],a[1],z]],[0,0,0],col))}
  return mk(F,o)}

function cyl(r,h,col,o){o=o||{};const seg=o.seg||18,rt=o.rt==null?r:o.rt,F=[],y=h/2,top=[],bot=[];
  for(let i=0;i<seg;i++){const a=i/seg*Math.PI*2;top.push([rt*Math.cos(a),y,rt*Math.sin(a)]);bot.push([r*Math.cos(a),-y,r*Math.sin(a)])}
  for(let i=0;i<seg;i++){const j=(i+1)%seg;F.push(orient([bot[i],bot[j],top[j],top[i]],[0,0,0],col))}
  if(o.caps!==false){if(rt>0)F.push(orient(top,[0,0,0],col));F.push(orient(bot,[0,0,0],col))}
  return mk(F,o.node)}

function sphere(r,col,o){o=o||{};const sg=o.seg||8,F=[];const P=(i,j)=>{const a=i/sg*Math.PI*2,b=j/sg*Math.PI-Math.PI/2;return[r*Math.cos(b)*Math.cos(a),r*Math.sin(b),r*Math.cos(b)*Math.sin(a)]};
  for(let i=0;i<sg;i++)for(let j=0;j<sg;j++){const q=[P(i,j),P(i+1,j),P(i+1,j+1),P(i,j+1)];F.push(orient(q.filter((p,k)=>k===0||Math.hypot(p[0]-q[k-1][0],p[1]-q[k-1][1],p[2]-q[k-1][2])>1e-6),[0,0,0],col))}
  return mk(F,o.node)}

const area=p=>{let a=0;for(let i=0;i<p.length;i++){const q=p[i],w=p[(i+1)%p.length];a+=q[0]*w[1]-w[0]*q[1]}return a};
function dec(pts,col,o){o=o||{};const z=o.z||0;let p=pts.map(q=>[q[0],q[1],z]);if(area(pts)<0)p.reverse();if(o.back)p.reverse();
  const n=new Node(o);n.f=[{p,c:hex(col),fl:1,two:o.two?1:0}];return n}
const rect=(w,h,col,o)=>dec([[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]],col,o);
const circ=(r,col,o)=>{o=o||{};const sg=o.seg||20,p=[];for(let i=0;i<sg;i++){const a=i/sg*Math.PI*2;p.push([r*Math.cos(a),r*Math.sin(a)])}return dec(p,col,o)};
const rrect=(w,h,r,col,o)=>dec(rr(w,h,r,3),col,o);
const group=o=>new Node(o);
function sprite(r,col,a,o){const n=new Node(o);n.spr={r,c:hex(col),a};return n}
function ring(r,col,a,lw,o){const n=new Node(o);n.ring={r,c:hex(col),a,lw:lw||2};return n}

/* ---------- matrices ---------- */
function mul(A,B){const o=new Array(9);for(let i=0;i<3;i++)for(let j=0;j<3;j++)o[i*3+j]=A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j];return o}
function rotM(r){const a=r[0],b=r[1],c=r[2],ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cc=Math.cos(c),sc=Math.sin(c);
  return mul([cb,0,sb,0,1,0,-sb,0,cb],mul([1,0,0,0,ca,-sa,0,sa,ca],[cc,-sc,0,sc,cc,0,0,0,1]))}
const app=(A,p)=>[A[0]*p[0]+A[1]*p[1]+A[2]*p[2],A[3]*p[0]+A[4]*p[1]+A[5]*p[2],A[6]*p[0]+A[7]*p[1]+A[8]*p[2]];
function compose(P,n){const R=rotM(n.r),s=Array.isArray(n.s)?n.s:[n.s,n.s,n.s];
  const RS=[R[0]*s[0],R[1]*s[1],R[2]*s[2],R[3]*s[0],R[4]*s[1],R[5]*s[2],R[6]*s[0],R[7]*s[1],R[8]*s[2]];
  const t=app(P.A,n.t);return{A:mul(P.A,RS),t:[t[0]+P.t[0],t[1]+P.t[1],t[2]+P.t[2]]}}
const xf=(M,p)=>{const q=app(M.A,p);return[q[0]+M.t[0],q[1]+M.t[1],q[2]+M.t[2]]};

/* ---------- renderer ---------- */
const LIGHT=(()=>{const l=[-.45,.85,.6],m=Math.hypot(...l);return l.map(v=>v/m)})();
class Scene{
  constructor(canvas){this.cv=canvas;this.ctx=canvas.getContext('2d');this.yaw=-.5;this.pitch=.28;this.zoom=1;this.D=320;this.hits=[];this.floorY=-48;this.floorR=78;this.floorCol='#FFFFFF';}
  size(w,h,dpr){this.W=w;this.H=h;this.cv.width=Math.round(w*dpr);this.cv.height=Math.round(h*dpr);this.dpr=dpr}
  prep(){const cy=Math.cos(this.yaw),sy=Math.sin(this.yaw),cp=Math.cos(this.pitch),sp=Math.sin(this.pitch);
    this.VA=mul([1,0,0,0,cp,-sp,0,sp,cp],[cy,0,sy,0,1,0,-sy,0,cy]);this.f=this.D*2.5*this.zoom*(this.W/390);this.cx=this.W/2;this.cy=this.H*(this.cyK||.4)}
  proj(p){const v=app(this.VA,p),d=this.D-v[2],k=this.f/d;return[this.cx+v[0]*k,this.cy-v[1]*k,d,k]}
  render(root,bg){this.prep();const ctx=this.ctx,items=[],self=this;let ord=0;this.hits=[];
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);ctx.clearRect(0,0,this.W,this.H);
    if(bg!==false)this.drawFloor();
    const D=this.D,VA=this.VA;
    const walk=(n,P,ak,hit)=>{if(!n.vis)return;const M=compose(P,n);
      if(n.anchor){ak=this.proj(xf(M,n.anchor))[2]-.05}else if(n.anchorP){ak=this.proj(xf(P,n.anchorP))[2]-.05}
      const h=n.hit||hit;
      for(const f of n.f){const W=f.p.map(q=>xf(M,q)),V=W.map(q=>app(VA,q));const nv=newell(V);
        if(!f.two){const c=V[0];if(nv[0]*(-c[0])+nv[1]*(-c[1])+nv[2]*(D-c[2])<=0)continue}
        let dep=0;for(const q of V)dep+=q[2];dep=D-dep/V.length;
        const key=ak!=null?ak-(ord++)*1e-4:dep+(n.bias||0);
        const m=Math.hypot(nv[0],nv[1],nv[2])||1;const nw=[(VA[0]*nv[0]+VA[3]*nv[1]+VA[6]*nv[2])/m,(VA[1]*nv[0]+VA[4]*nv[1]+VA[7]*nv[2])/m,(VA[2]*nv[0]+VA[5]*nv[1]+VA[8]*nv[2])/m];
        let sh=f.fl?1:.8+.2*Math.max(0,nw[0]*LIGHT[0]+nw[1]*LIGHT[1]+nw[2]*LIGHT[2]);
        const g=n.glow;sh=sh+g*(1-sh);let c=f.c;
        let R=c[0]*sh,G=c[1]*sh,B=c[2]*sh;if(g){R+= (255-R)*g*.3;G+=(255-G)*g*.3;B+=(255-B)*g*.3}
        items.push({k:key,t:0,pts:V.map(q=>{const kk=this.f/(D-q[2]);return[this.cx+q[0]*kk,this.cy-q[1]*kk]}),c:`rgb(${R|0},${G|0},${B|0})`,s:`rgb(${R*.78|0},${G*.78|0},${B*.78|0})`,a:n.alpha,h:h})}

function confetti(){if(isReduce())return;const cv=$('#confetti'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const cols=['#6B4EDB','#8EF0BC','#F6A9D8','#FFE680','#A9DDF7','#D2F34C'];const P=[];for(let i=0;i<90;i++)P.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*15-4,r:Math.random()*6+4,c:cols[i%6],a:Math.random()*6,va:(Math.random()-.5)*.4});
 let f=0;(function step(){ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.5;p.vx*=.99;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});if(++f<110)requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height)})()}

 const S=initState(d),m=d.build(S);for(let i=0;i<24;i++)m.tick(S,.2,i*.2);sc.thumb=1;m.draw?m.draw(sc):sc.render(m.root,false);return THUMB[d.id]=cv.toDataURL()}catch(e){return THUMB[d.id]=''}}
